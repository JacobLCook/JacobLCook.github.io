<!DOCTYPE html>

<html lang="en-GB">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		{% seo %}

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="{{ site.baseurl }}/css/screen.css">
		<link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
		<link rel="icon" type="image/png" href="{{ site.baseurl }}/touch-icon.png" sizes="192x192">

		{% if jekyll.environment == 'production' and site.google_analytics_key != '' %}
			<script>
				window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
				ga('create', '{{ site.google_analytics_key }}', 'auto');
				ga('send', 'pageview');
			</script>
			<script async src='https://www.google-analytics.com/analytics.js'></script>
		{% endif %}
	</head>

	<body class="page-{{ page.body_class | default: 'default' }}">
		<header class="site-header">
			<div class="container site-header__inner">
				<a class="wordmark" href="{{ site.baseurl }}/">JLCook <span>Photography</span></a>
				{% include navigation.html %}
			</div>
		</header>

		<main>
			{{ content }}
		</main>

		<footer class="site-footer">
			<div class="container site-footer__inner">
				<p>&copy; {{ site.time | date: '%Y' }} JLCook Photography</p>
				<p>Cambridge &amp; the East of England</p>
			</div>
		</footer>

		{% include lightbox.html %}
	</body>
</html>
