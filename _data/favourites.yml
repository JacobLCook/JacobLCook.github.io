# Photos on the Favourites page, in display order.
# `image` is the path to a photo already in /photos/.

- image: /photos/birds/swan-and-rowers.jpg
  title: The Pursuit
  caption: Swan - River Cam, UK
  description: Noticed this swan swimming quickly away from an oncoming boat which appears quite nicely slightly out of focus in the background.
  settings:
    focal_length: 155mm
    aperture: f/5
    shutter: 1/4000s
    iso: 560

- image: /photos/birds/heron-over-water.jpg
  title: Flyby
  caption: Grey Heron - River Cam, UK
  description: Managed to get a fairly clean shot on this heron as it surprised us flying past. Only managed one shot and with manual focus so very happy with how it turned out.
  settings:
    focal_length: 300mm
    aperture: f/5.6
    shutter: 1/1600s
    iso: 800

- image: /photos/birds/egyptian-goose.jpg
  title: Celadon
  caption: Egyptian Goose - West Stow, UK
  description: The sun shining on the water and some sort of algae in the water creates this wonderful shimmering blue and green effect that contrasts nicely against the more matte and muted body of the goose.
  settings:
    focal_length: 220mm
    aperture: f/5
    shutter: 1/1250s
    iso: 800

- image: /photos/birds/cormorant-splash.jpg
  title: Making a splash
  caption: Cormorant - River Cam, UK
  description: Followed this cormorant down the Cam for a while until it surfaced long enough for a good shot, with a lovely little splash.
  settings:
    focal_length: 300mm
    aperture: f/5.6
    shutter: 1/2000s
    iso: 800

- image: /photos/birds/cygnet-riding.jpg
  title: Catching a lift
  caption: Mute Swan with Cygnet - Lammas Land Cambridge, UK
  description: An adorable scene of a cygnet catching a ride. The sunlight filtering through the plants combined with the parent swan's head being slightly obscured give a nice emphasis on the cygnet as the image focus.
  settings:
    focal_length: 300mm
    aperture: f/8
    shutter: 1/1000s
    iso: 800

- image: /photos/birds-of-prey/kestrel-soaring.jpg
  title: Soaring
  caption: Kestrel - Grantchester, UK
  description: This kestrel often hunts in around Grantchester, here I was lucky enough to catch it in flight. Although the image isn't especially sharp, I quite like how the clouds and azure sky texture the background.
  settings:
    focal_length: 300mm
    aperture: f/8
    shutter: 1/4000
    iso: 450
