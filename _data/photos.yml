# ---------------------------------------------------------------
# All photos on the site live here. To add one:
#   1. Put the image in /uploads/
#   2. Add an entry below:
#
#   - image: 60.jpg              # filename in /uploads/ (case-sensitive!)
#     subject: Kingfisher
#     location: River Cam, UK
#     tags: [birds]              # any of: birds, scenes, favourites
#
# Every photo appears on Home automatically. Tags add it to other pages.
#
# Photos tagged `favourites` can also have (all optional):
#     title: Flyby
#     description: A sentence or two about the shot.
#     settings:
#       focal_length: 300mm
#       aperture: f/5.6
#       shutter: 1/1600s
#       iso: 800
# ---------------------------------------------------------------

- image: 1.JPG
  subject: Swan
  location: River Cam, UK
  tags: [birds, favourites]
  title: The Pursuit
  description: Noticed this swan swimming quickly away from an oncoming boat which appears quite nicely slightly out of focus in the background.
  settings:
    iso: 560
    aperture: f/5
    shutter: 1/4000s
    focal_length: 155mm

- image: 2.JPG
  subject: Grey Heron
  location: River Cam, UK
  tags: [birds, favourites]
  title: Flyby
  description: Managed to get a fairly clean shot on this heron as it surprised us flying past. Only managed one shot and with manual focus so very happy with how it turned out.
  settings:
    iso: 800
    aperture: f/5.6
    shutter: 1/1600s
    focal_length: 300mm

- image: 3.JPG
  subject: Egyptian Goose
  location: West Stow, UK
  tags: [birds, favourites]
  title: Celadon
  description: The sun shining on the water and some sort of algae in the water creates this wonderful shimmering blue and green effect that contrasts nicely against the more matte and muted body of the goose.
  settings:
    iso: 800
    aperture: f/5
    shutter: 1/1250s
    focal_length: 220mm

