<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
	<button class="lightbox__btn lightbox__close" type="button" aria-label="Close">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
	</button>
	<button class="lightbox__btn lightbox__prev" type="button" aria-label="Previous photo">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
	</button>
	<figure class="lightbox__figure">
		<img class="lightbox__img" alt="">
	</figure>
	<button class="lightbox__btn lightbox__next" type="button" aria-label="Next photo">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
	</button>
	<p class="lightbox__count" aria-live="polite"></p>
</div>
<script src="{{ site.baseurl }}/js/lightbox.js" defer></script>
